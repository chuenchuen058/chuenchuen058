dth="9.8" height="9.8" rx="2" fill="#0d1117" stroke="#d29922" stroke-width="2" transform="rotate(-298 360.1 90.7)"/></g><g style="transform-box:fill-box;transform-origin:center;animation:wiggle 1.6s ease-in-out 0.78s infinite alternate"><rect x="363.7" y="76.1" width="9.2" height="9.2" rx="2" fill="#0d1117" stroke="#d29922" stroke-width="2" transform="rotate(-323 368.3 80.7)"/></g><g style="transform-box:fill-box;transform-origin:center;animation:wiggle 1.6s ease-in-out 0.91s infinite alternate"><rect x="366.6" y="64.8" width="8.5" height="8.5" rx="2" fill="#0d1117" stroke="#d29922" stroke-width="2" transform="rotate(-349 370.9 69.0)"/></g><g style="transform-box:fill-box;transform-origin:center;animation:wiggle 1.6s ease-in-out 1.04s infinite alternate"><rect x="364.4" y="54.5" width="7.9" height="7.9" rx="2" fill="#0d1117" stroke="#d29922" stroke-width="2" transform="rotate(-374 368.4 58.5)"/></g><g style="transform-box:fill-box;transform-origin:center;animation:wiggle 1.6s ease-in-out 1.17s infinite alternate"><rect x="358.4" y="47.3" width="7.3" height="7.3" rx="2" fill="#0d1117" stroke="#d29922" stroke-width="2" transform="rotate(-399 362.0 50.9)"/></g><g style="transform-box:fill-box;transform-origin:center;animation:wiggle 1.6s ease-in-out 1.30s infinite alternate"><rect x="350.5" y="44.1" width="6.6" height="6.6" rx="2" fill="#0d1117" stroke="#d29922" stroke-width="2" transform="rotate(-425 353.9 47.4)"/></g><g style="transform-box:fill-box;transform-origin:center;animation:wiggle 1.6s ease-in-out 1.43s infinite alternate"><rect x="343.0" y="45.0" width="6.0" height="6.0" rx="2" fill="#0d1117" stroke="#d29922" stroke-width="2" transform="rotate(-450 346.0 48.0)"/></g><circle cx="304.5" cy="77.4" r="8" fill="#161b22" stroke="#d29922" stroke-width="1.8"/><line x1="304.5" y1="77.4" x2="304.5" y2="65.4" stroke="#d29922" stroke-width="2.5" stroke-linecap="round" style="transform-origin:304.5px 77.4px;animation:horn 1.6s ease-in-out infinite alternate"/><circle cx="304.5" cy="77.4" r="2" fill="#d29922"/>
